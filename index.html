    <script>

            let showicon = "M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-72q-45 0-76.5-31.5T372-500q0-45 31.5-76.5T480-608q45 0 76.5 31.5T588-500q0 45-31.5 76.5T480-392Zm0 192q-146 0-266-81.5T40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200Zm0-300Zm0 220q113 0 207.5-59.5T832-500q-50-101-144.5-160.5T480-720q-113 0-207.5 59.5T128-500q50 101 144.5 160.5T480-280Z";

            let button = $("#iconpassword")[0];
            let input = $(".passwordz")[0];
            let input1 = $(".passwordz")[1];
            $("#iconbtn").click(function () {
                let seticon = button.getAttribute("d");

                if (seticon === showicon) {
                    button.setAttribute("d", hideicon);
                    input.setAttribute("type", "text");
                    input1.setAttribute("type", "text");
                }
                else {
                    button.setAttribute("d", showicon);
                    input.setAttribute("type", "password");
                    input1.setAttribute("type", "password");
                }
            });

        });
    </script>



    <script>

        $.validator.addMethod("strongPassword", function (value, element) {
            return this.optional(element) || 
            /^(?=(?:.*[A-Z]))(?=(?:.*[a-z]){9,})(?=(?:.*[1-9]){3,})(?=.*[!@#$%^*&])[A-Za-z1-9!@#$%^*&]{14}$/.test(value)    
        }
    
    );

        $(document).ready(function () {


            let form = $("#formsubmission");
            let formbtn = $("#formbtn");


            function togglebtn() {
                if (form.valid()) {
                    formbtn.prop("disabled", false).addClass("enabled");
                }
                else {
                    formbtn.prop("disabled", true).addClass("enabled");
                }
            }


            form.validate({
                onkeyup: function (element) {
                    this.element(element);
                    togglebtn()
                },
                onclick: function (element) {
                    this.element(element);
                    togglebtn()
                },

                rules: {
                    fullname: {
                        required: true,
                        minlength: 10,
                    },
                    email: {
                        required: true,
                        email: true
                    },
                    password: {
                        required: true,
                        strongPassword:true

                    },
                    con_password: {
                        required: true,
                        equalTo: "[name='password']"
                    }
                },
                messages: {
                    fullname: {
                        required: "FullName is Required",
                        minlength: "bhai jan 10 character wala name likho ",

                    },
                    email: {
                        required: "Email is Required",
                        email: "Bhai Correct Email Add kr"
                    },
                    password: {
                        required: "Password is Required",
                        strongPassword:"First Letter is Capital , Minimum Insert 9 Character , 3 numbers , 1 special character",

                    },
                    con_password: {
                        required: "Confirm Password is Required",
                        equalTo: "Password Same Nhi Hai"
                    }
                },
                submitHandler: function () {
                    Swal.fire({
                        title: "Good job!",
                        text: `thanks! `,
                        icon: "success",

                    }).then((result) => {
                        if (result.isConfirmed) {
                            form[0].reset();
                        }
                    });
                    alert("form submitted successfully");
                    form.reset();



                }



            });



        });
    </script>
